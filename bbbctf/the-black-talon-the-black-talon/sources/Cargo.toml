[workspace]
members = [
    "client",
    "network",
    "orchestrator",
    "common",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
num-bigint = { version = "0.4.6", features = ["rand"] }
num-prime = "0.4.4"
openssl = { version = "0.10.76", features = ["vendored"] }
rand = "0.8.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[profile.release]
debug = 1
